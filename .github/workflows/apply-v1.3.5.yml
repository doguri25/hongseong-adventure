name: Apply verified v1.3.5 mobile dialogue update

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v1.3.5.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-update-v1.3.5
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply the locally tested source delta without overwriting unrelated changes
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib
          # Compressed UTF-8 source edits from the user-provided v1.3.2 archive
          # to v1.3.5. Each edited file has exact before/after SHA-256 checks.
          encoded = '''
          
          
          
          '''
          payload = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == '58e08afb60a14d2fea1fe130a1440471aad1a4cad726e5b46f73ddc4a576839d', 'Source transfer checksum mismatch'
          changes = json.loads(payload)
          root = pathlib.Path.cwd().resolve()
          pending = []
          for change in changes:
              path = root / change['path']
              if not path.resolve().is_relative_to(root) or path.is_symlink():
                  raise SystemExit('Unsafe source path')
              if path.parts[-1].startswith('.env') or change['path'].startswith('.github/'):
                  raise SystemExit('Unexpected source path')
              before = path.read_bytes() if path.exists() else None
              digest = hashlib.sha256(before).hexdigest() if before is not None else None
              if digest == change['after']:
                  continue
              if digest != change['before']:
                  raise SystemExit('Existing source has changed; refusing to overwrite ' + change['path'])
              text = (before or b'').decode('utf-8')
              for start, end, replacement in reversed(change['edits']):
                  assert 0 <= start <= end <= len(text), 'Invalid source edit'
                  text = text[:start] + replacement + text[end:]
              after = text.encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == change['after'], 'Edited file checksum mismatch: ' + change['path']
              pending.append((path, after))
          for path, content in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              print('Updated:', path.relative_to(root))
          print('Verified source files:', len(changes))
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all application tests before committing
        run: node --test tests/*.test.js
      - name: Commit source and push without rewriting history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist tests README.md CHANGELOG.md package.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: reduce dialogue text and ship mobile UI improvements (v1.3.5)'
            git push origin HEAD:main
          fi
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the existing Pages test and deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
