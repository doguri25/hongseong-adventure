name: Apply verified v1.3.6 phone controls

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v1.3.6.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-update-v1.3.6
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout current main without rewriting history
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply the locally tested patch with exact before and after checksums
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          encoded = ''
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != '7e005fbef66413fd3daf55d5f5cf636574daccdb5ea00a2ecaa0aaea3ed84916':
              raise SystemExit('Patch payload checksum mismatch; no application files changed.')
          update = json.loads(raw)
          def digest(name):
              path = pathlib.Path(name)
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          for name in update['old']:
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in ('dist', 'tests', 'package.json'):
                  raise SystemExit('Unexpected patch path.')
          if not all(digest(name) == value for name, value in update['new'].items()):
              for name, value in update['old'].items():
                  if digest(name) != value:
                      raise SystemExit(f'{name} changed since verification; refusing to overwrite it.')
              patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phone-controls-v1.3.6.patch'
              patch.write_text(update['patch'], encoding='utf-8')
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
          for name, value in update['new'].items():
              if digest(name) != value:
                  raise SystemExit(f'{name}: resulting checksum mismatch; source will not be committed.')
          print('All 9 application/test files match the locally tested v1.3.6 patch exactly.')
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all application tests before pushing
        run: node --test tests/*.test.js
      - name: Commit application changes and push main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/index.html dist/game.js dist/mobile-ui.js dist/touch-ui.js dist/phone-controls.css dist/release.js package.json tests/arrival-ui.test.js tests/phone-controls.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: prevent long-press selection and merge landscape HUD into header (v1.3.6)'
            git push origin HEAD:main
          fi
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the existing tested GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --repo "$REPOSITORY" --ref main
