name: Import v1.3.2 source and publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-import-v1.3.2
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'source-v1.3.2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main without rewriting its history
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Download the user-provided source archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh release download source-v1.3.2 --repo "$REPOSITORY" --pattern 'hongseong-adventure-v1.3.2-source.zip' --dir "$RUNNER_TEMP/source-download"
      - name: Verify archive and import source safely
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, stat, tempfile, zipfile
          expected = '96a996350f9ba02fb670f78529926c616c86037471908c49d3260f729eb732bf'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-download/hongseong-adventure-v1.3.2-source.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Archive checksum mismatch; no source files changed.')
          root = pathlib.Path.cwd()
          marker = root / '.source-import.json'
          if (root / 'dist/index.html').exists():
              if not marker.exists() or json.loads(marker.read_text()).get('archive_sha256') != expected:
                  raise SystemExit('An existing application was found. Refusing to overwrite it.')
              print('This archive was previously imported; preserving current source and rerunning verification.')
          else:
              stage = pathlib.Path(tempfile.mkdtemp(prefix='hongseong-import-'))
              allowed_dirs = {'dist', 'tests', 'scripts', 'research'}
              allowed_files = {'package.json', 'README.md', 'CHANGELOG.md', '.gitignore'}
              with zipfile.ZipFile(archive) as bundle:
                  if sum(item.file_size for item in bundle.infolist()) > 100_000_000:
                      raise SystemExit('Unexpected uncompressed archive size.')
                  for item in bundle.infolist():
                      parts = pathlib.PurePosixPath(item.filename).parts
                      if not parts or parts[0] != 'hongseong-adventure-v1.3.2' or '..' in parts or '\\' in item.filename:
                          raise SystemExit('Unexpected or unsafe archive path.')
                      if stat.S_ISLNK(item.external_attr >> 16):
                          raise SystemExit('Symbolic links are not accepted.')
                      relative = pathlib.PurePosixPath(*parts[1:])
                      if not relative.parts or item.is_dir():
                          continue
                      if relative.parts[0] not in allowed_dirs and str(relative) not in allowed_files:
                          continue
                      target = stage.joinpath(*relative.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(bundle.read(item))
              package = json.loads((stage / 'package.json').read_text())
              if package.get('version') != '1.3.2' or not (stage / 'dist/index.html').is_file():
                  raise SystemExit('The archive is not the expected application.')
              for child in stage.iterdir():
                  if child.is_dir():
                      shutil.copytree(child, root / child.name, dirs_exist_ok=True)
                  else:
                      shutil.copy2(child, root / child.name)
              marker.write_text(json.dumps({'version': '1.3.2', 'archive_sha256': expected}, indent=2) + '\n')
              with (root / '.gitignore').open('a') as ignore:
                  ignore.write('\n.openai/\nnode_modules/\n.env\n.env.*\n')
              print('Original source imported; hosting-specific .openai metadata excluded.')
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test before committing or publishing
        run: node --test tests/*.test.js
      - name: Commit source and push to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist tests scripts research package.json README.md CHANGELOG.md .gitignore .source-import.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat: import verified Hongseong Adventure v1.3.2 source'
            git push origin HEAD:main
          fi
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare static site
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish the tested application
        id: deployment
        uses: actions/deploy-pages@v4
